<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetWatch — AI Chat Simulation & Prompt Shield Test</title>
  <style>
    :root {
      --bg: #212121;
      --card-bg: #2f2f2f;
      --border: #424242;
      --text: #ececec;
      --text-muted: #b4b4b4;
      --accent: #D94825;
      --user-bubble: #2f2f2f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171717;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }
    .brand span.badge {
      background: rgba(217, 72, 37, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      justify-content: space-between;
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow-y: auto;
      margin-bottom: 24px;
    }
    .message {
      padding: 14px 18px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 14px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .message.user {
      align-self: flex-end;
      background: #10a37f;
      color: #fff;
    }
    .prompt-area {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    #prompt-textarea {
      width: 100%;
      min-height: 56px;
      max-height: 180px;
      outline: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      overflow-y: auto;
    }
    #prompt-textarea[placeholder]:empty:before {
      content: attr(placeholder);
      color: var(--text-muted);
    }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
    }
    .btn-quick-fill {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-quick-fill:hover {
      background: rgba(255,255,255,0.14);
    }
    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send-btn:hover {
      opacity: 0.85;
    }
    .notice {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>ChatGPT / AI Simulator</span>
      <span class="badge">NetWatch Test Bed</span>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">
      In-Page Prompt Guardian Active
    </div>
  </header>

  <main>
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">
        👋 Hi! I'm an AI assistant. How can I help you with your school homework today?
      </div>
    </div>

    <div>
      <div class="prompt-area">
        <div id="prompt-textarea" contenteditable="true" role="textbox" placeholder="Message ChatGPT..."></div>
        <div class="action-row">
          <button type="button" class="btn-quick-fill" id="btnFillDemo">
            Fill Demo Prompt (with Phone & Address)
          </button>
          <button type="button" class="send-btn" id="sendBtn" data-testid="send-button" aria-label="Send prompt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div class="notice">
        Type personal info or click "Fill Demo Prompt", then press Enter or click Send to see NetWatch intercept and sanitize the prompt!
      </div>
    </div>
  </main>

  <script>
    const textarea = document.getElementById('prompt-textarea');
    const sendBtn = document.getElementById('sendBtn');
    const btnFillDemo = document.getElementById('btnFillDemo');
    const messages = document.getElementById('chatMessages');

    btnFillDemo.onclick = () => {
      textarea.innerText = "Hi! Can you help me with my homework? My phone number is 415-555-0199 and I live at 742 Evergreen Terrace.";
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
      textarea.focus();
    };

    function sendMessage() {
      const text = textarea.innerText.trim();
      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = text;
      messages.appendChild(userMsg);

      textarea.innerText = '';

      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'message assistant';
        botMsg.textContent = "I received your message: \"" + text + "\". Let's get started on your homework!";
        messages.appendChild(botMsg);
        messages.scrollTop = messages.scrollHeight;
      }, 500);

      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
